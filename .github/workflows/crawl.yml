name: Daily trend crawl

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest

    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB: ${{ secrets.MONGO_DB || 'test' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        run: pip install requests beautifulsoup4 pymongo python-dotenv feedparser

      - name: Run crawler
        working-directory: crawler
        run: python crawler.py
